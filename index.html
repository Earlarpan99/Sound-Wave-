<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sound Wave | Batches</title>
    <meta
      name="description"
      content="Sound Wave batches list."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell app-shell-no-sidebar">
      <main class="main-panel list-panel batches-page">
        <section class="batch-list-shell" aria-labelledby="batches-title" data-batches-page>
          <header class="batches-heading">
            <div class="batches-heading-copy">
              <p class="batches-eyebrow">Learning workspace</p>
              <h1 id="batches-title">Batches</h1>
              <p class="batches-description">Browse learning groups, subjects, and students.</p>
            </div>
            <div class="batches-total" aria-live="polite">
              <strong data-total-batches>1</strong>
              <span>total batch</span>
            </div>
          </header>

          <div class="batch-toolbar">
            <div class="toggle-tabs" role="tablist" aria-label="Filter batches by status">
              <button class="tab active" id="active-tab" type="button" role="tab" aria-selected="true" aria-controls="batch-results" tabindex="0" data-status="active">
                <span>Active</span><span class="tab-count" data-count="active">1</span>
              </button>
              <button class="tab" id="inactive-tab" type="button" role="tab" aria-selected="false" aria-controls="batch-results" tabindex="-1" data-status="inactive">
                <span>Inactive</span><span class="tab-count" data-count="inactive">0</span>
              </button>
            </div>

            <div class="batch-search-field">
              <label class="visually-hidden" for="batch-search">Search batches by name</label>
              <span class="batch-search-icon" aria-hidden="true">⌕</span>
              <input id="batch-search" type="text" placeholder="Search batches by name" autocomplete="off" />
              <button class="clear-search" type="button" aria-label="Clear search" title="Clear search" hidden>&times;</button>
              <kbd class="search-shortcut" aria-hidden="true">/</kbd>
            </div>
          </div>

          <p class="results-summary" id="batch-results-summary" aria-live="polite"></p>

          <div class="batch-results" id="batch-results" role="tabpanel" aria-labelledby="active-tab" aria-busy="true">
            <div class="batch-skeleton" aria-hidden="true">
              <span class="skeleton-line skeleton-title"></span>
              <span class="skeleton-line skeleton-meta"></span>
              <span class="skeleton-line skeleton-meta-short"></span>
              <div class="skeleton-badges"><i></i><i></i><i></i><i></i></div>
              <span class="skeleton-line skeleton-footer"></span>
            </div>
          </div>

          <div class="batch-empty-state" id="batch-empty-state" role="status" hidden>
            <span class="empty-state-mark" aria-hidden="true">⌕</span>
            <strong data-empty-title>No batches found</strong>
            <p data-empty-description>Try a different search or status filter.</p>
            <button class="reset-search" type="button" hidden>Clear search</button>
          </div>

          <div class="batch-load-error" id="batch-load-error" role="alert" hidden>
            <strong>We couldn’t load batches.</strong>
            <p>Please try again.</p>
            <button class="reset-search" type="button" data-retry>Retry</button>
          </div>

          <footer class="data-footer">
            <label class="rows-wrap" for="rows-per-page">
              <span>Rows per page</span>
              <select id="rows-per-page">
                <option value="8">8</option>
                <option value="16" selected>16</option>
                <option value="32">32</option>
              </select>
            </label>

            <div class="pager">
              <span class="pagination-summary" id="pagination-summary" aria-live="polite">0-0 of 0</span>
              <div class="pager-controls" aria-label="Batch list pagination">
                <button type="button" data-page="previous" aria-label="Previous page" title="Previous page" disabled>&larr;</button>
                <span class="page-indicator" id="page-indicator" aria-current="page">1 / 1</span>
                <button type="button" data-page="next" aria-label="Next page" title="Next page" disabled>&rarr;</button>
              </div>
            </div>
          </footer>
        </section>
      </main>
    </div>

    <template id="batch-card-template">
      <a class="batch-list-card batch-list-link" href="batch.html">
        <div class="batch-card-heading">
          <h2 data-field="name"></h2>
          <span class="batch-status-pill"><span class="batch-status-dot"></span><span data-field="status"></span></span>
        </div>
        <dl class="batch-metadata">
          <div><dt>Grade</dt><dd data-field="grade"></dd></div>
          <div><dt>Curriculum</dt><dd data-field="curriculum"></dd></div>
          <div><dt>Section</dt><dd data-field="section"></dd></div>
        </dl>
        <div class="batch-subject-section">
          <h3>Subjects</h3>
          <div class="batch-tags" data-field="subjects"></div>
        </div>
        <div class="batch-foot">
          <span class="teacher-avatar" data-field="teacher" aria-hidden="true"></span>
          <span class="member-count" data-field="members"></span>
          <span class="batch-card-open">Open batch <span aria-hidden="true">&rarr;</span></span>
        </div>
      </a>
    </template>

    <script src="script.js"></script>
  </body>
</html>
